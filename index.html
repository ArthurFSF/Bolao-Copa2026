<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // Inicialização utilizando o objeto CONFIG já existente no seu código
    const app = initializeApp(CONFIG.FIREBASE);
    const auth = getAuth(app);

    // Mapeamento dos elementos da interface
    const authForm = document.getElementById('auth-form');
    const emailInput = document.getElementById('auth-email');
    const passwordInput = document.getElementById('auth-password');
    const errorDiv = document.getElementById('auth-error');
    const submitButton = authForm.querySelector('button[type="submit"]');

    // Interceptação do evento de submissão (Login)
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault(); // Impede o recarregamento da página

        // Feedback visual de processamento
        const originalButtonText = submitButton.innerText;
        submitButton.innerText = "Processando...";
        submitButton.classList.add('loading');
        submitButton.disabled = true;
        errorDiv.classList.add('hidden');

        try {
            const userCredential = await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
            
            // Sucesso na autenticação
            console.log("Login efetuado com sucesso:", userCredential.user.email);
            
            // Aqui você deve inserir a lógica para esconder a tela de login e mostrar o conteúdo do app
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-content').classList.remove('hidden');
            document.getElementById('user-info').innerText = userCredential.user.email;
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('login-btn').classList.add('hidden');

        } catch (error) {
            // Tratamento de falhas (credenciais inválidas, rede, etc.)
            console.error("Erro na autenticação:", error.code);
            errorDiv.innerText = "Falha ao acessar: Verifique seu e-mail e senha.";
            errorDiv.classList.remove('hidden');
        } finally {
            // Restauração do estado do botão
            submitButton.innerText = originalButtonText;
            submitButton.classList.remove('loading');
            submitButton.disabled = false;
        }
    });
</script>
