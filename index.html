<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa do Mundo 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --verde: #092c5e;
            --amarelo: #ffd700;
            --azul: #0066cc;
            --cinza-claro: #f5f5f5;
            --cinza-escuro: #333333;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .estado-salvo { @apply bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-semibold; }
        .estado-nao-salvo { @apply bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-semibold; }
        .estado-pendente { @apply bg-red-100 text-red-800 px-3 py-1 rounded-full text-xs font-semibold; }
        .estado-processado { @apply bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-semibold; }
        .card-jogo { @apply bg-white border border-gray-200 rounded-lg p-4 mb-3 shadow-sm hover:shadow-md transition; }
        .btn-primario { @apply bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-semibold; }
        .btn-secundario { @apply bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 transition; }
        .loading { @apply opacity-50 cursor-not-allowed; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- ========================================
         CONFIGURAÇÃO CRÍTICA: SUBSTITUA PELOS VALORES DE PRODUÇÃO
         ======================================== -->
    <script>
        // ⚠️ ALERTA: NÃO FAÇA COMMIT DE CREDENCIAIS REAIS NO GITHUB
        // Substitua estes valores pelas chaves de produção antes de fazer deploy
        const CONFIG = {
            FIREBASE: {
                apiKey: "AIzaSyDYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY",
                authDomain: "copa-2026-bolao.firebaseapp.com",
                projectId: "copa-2026-bolao",
                storageBucket: "copa-2026-bolao.appspot.com",
                messagingSenderId: "123456789000",
                appId: "1:123456789000:web:abcdef1234567890"
            },
            EMAILJS: {
                serviceId: "service_XXXXXXXX",
                templateId: "template_XXXXXXXX",
                userId: "YOUR_EMAILJS_PUBLIC_KEY"
            },
            TIMEZONE: "America/Sao_Paulo"
        };
    </script>

    <!-- ======================================== ESTRUTURA HTML ======================================== -->
    <div id="app" class="min-h-screen bg-gray-50">
        <!-- Navbar -->
        <nav class="sticky top-0 z-50 bg-white shadow">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-blue-600">⚽ Bolão Copa 2026</h1>
                <div id="user-info" class="text-sm text-gray-600"></div>
                <button id="logout-btn" class="btn-primario hidden">Sair</button>
                <button id="login-btn" class="btn-primario">Entrar</button>
            </div>
        </nav>

        <!-- Conteúdo Principal -->
        <div class="max-w-6xl mx-auto px-4 py-6">
            <!-- Telas de Autenticação -->
            <div id="auth-screen" class="auth-screen">
                <div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-lg shadow-lg">
                    <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center">Login</h2>
                    <form id="auth-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">E-mail</label>
                            <input id="auth-email" type="email" required placeholder="seu@email.com" 
                                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Senha</label>
                            <input id="auth-password" type="password" required placeholder="••••••••" 
                                class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <button type="submit" class="btn-primario w-full">Entrar</button>
                    </form>
                    <p id="auth-toggle" class="text-center text-sm text-gray-600 mt-4 cursor-pointer">
                        Não tem conta? <span class="text-blue-600 font-semibold">Registre-se</span>
                    </p>
                    <div id="auth-error" class="mt-4 p-3 bg-red-100 text-red-800 rounded-lg hidden"></div>
                </div>
            </div>

            <!-- App Principal (após login) -->
            <div id="app-content" class="hidden">
                <!-- Abas -->
                <div class="flex gap-2 mb-6 border-b border-gray-300">
                    <button data-tab="jogos" class="tab-btn px-4 py-2 border-b-2 border-blue-600 text-blue-600 font-semibold">
                        🎯 Jogos
                    </button>
                    <button data-tab="ranking" class="tab-btn px-4 py-2 text-gray-600 hover:text-gray-800">
                        🏆 Ranking
                    </button>
                    <button data-tab="admin" class="tab-btn px-4 py-2 text-gray-600 hover:text-gray-800 hidden">
                        ⚙️ Admin
                    </button>
                </div>

                <!-- Aba: Jogos -->
                <div id="jogos" class="tab-content active">
                    <div class="mb-4 flex gap-2 flex-wrap">
                        <select id="fase-filter" class="border border-gray-300 rounded-lg px-3 py-2">
                            <option value="">Todas as Fases</option>
                            <option value="Grupos">Fase de Grupos</option>
                            <option value="Oitavas">Oitavas de Final</option>
                            <option value="Quartas">Quartas de Final</option>
                            <option value="Semis">Semifinais</option>
                            <option value="Final">Final</option>
                        </select>
                    </div>
                    <div id="jogos-container" class="space-y-4"></div>
                    <button id="carregar-mais-jogos" class="btn-primario w-full mt-6 hidden">Carregar Mais Jogos</button>
                </div>

                <!-- Aba: Ranking -->
                <div id="ranking" class="tab-content">
                    <div class="bg-white rounded-lg shadow">
                        <table class="w-full">
                            <thead class="bg-blue-600 text-white">
                                <tr>
                                    <th class="px-4 py-3 text-left">Posição</th>
                                    <th class="px-4 py-3 text-left">Participante</th>
                                    <th class="px-4 py-3 text-center">Pontos</th>
                                    <th class="px-4 py-3 text-center">Acertos</th>
                                </tr>
                            </thead>
                            <tbody id="ranking-tbody" class="divide-y">
                                <tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <button id="carregar-mais-ranking" class="btn-primario w-full mt-6 hidden">Carregar Mais</button>
                </div>

                <!-- Aba: Admin -->
                <div id="admin" class="tab-content">
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Painel de Resultados -->
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-bold mb-4">Processar Resultados</h3>
                            <div id="admin-jogos-container" class="space-y-3"></div>
                        </div>

                        <!-- Painel de E-mails -->
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-lg font-bold mb-4">Enviar E-mails</h3>
                            <div class="space-y-3">
                                <textarea id="email-message" placeholder="Mensagem personalizada..." 
                                    class="w-full border border-gray-300 rounded-lg px-4 py-2 h-32"></textarea>
                                <button id="send-emails-btn" class="btn-primario w-full">Enviar E-mails em Lote</button>
                                <div id="email-status" class="text-sm text-gray-600"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ======================================== FIREBASE & EMAILJS ======================================== -->
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>

    <!-- ======================================== JAVASCRIPT ======================================== -->
    <script>
        // Funções auxiliares de data (sem dependência de dayjs complexo)
        function formatarData(timestamp) {
            if (!timestamp) return '-';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const dia = String(date.getDate()).padStart(2, '0');
            const mes = String(date.getMonth() + 1).padStart(2, '0');
            const hora = String(date.getHours()).padStart(2, '0');
            const min = String(date.getMinutes()).padStart(2, '0');
            return `${dia}/${mes} ${hora}:${min}`;
        }

        // ========== FIREBASE ==========
        const firebaseApp = firebase.initializeApp(CONFIG.FIREBASE);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Habilitar persistência offline com fallback
        async function initFirestore() {
            try {
                await db.enableIndexedDbPersistence();
                console.log("✅ Persistência offline ativada");
            } catch (err) {
                if (err.code === 'failed-precondition') {
                    console.log("📌 Modo online (múltiplas abas detectadas)");
                } else if (err.code === 'unimplemented') {
                    console.log("📌 Navegador sem suporte a IndexedDB");
                }
            }
        }
        initFirestore();

        // ========== EMAILJS ==========
        emailjs.init(CONFIG.EMAILJS.userId);

        // ========== ESTADO GLOBAL ==========
        const state = {
            currentUser: null,
            currentTab: 'jogos',
            jogosPage: 0,
            rankingPage: 0,
            listeners: [],
            jogosPaginados: [],
            rankingPaginado: [],
            faseFilter: ''
        };

        const ITEMS_POR_PAGINA = 12;
        const RANKING_POR_PAGINA = 20;

        // ========== FUNÇÕES UTILITÁRIAS ==========
        function estaTravaAtivaParaJogo(jogo) {
            if (!jogo.dataHora) return false;
            const jogoDate = jogo.dataHora.toDate ? jogo.dataHora.toDate() : new Date(jogo.dataHora);
            const agora = new Date();
            const diffMinutos = (jogoDate - agora) / (1000 * 60);
            return diffMinutos < 120;
        }

        function limparListeners() {
            state.listeners.forEach(unsubscribe => {
                try { unsubscribe(); } catch (e) {}
            });
            state.listeners = [];
        }

        // ========== AUTENTICAÇÃO ==========
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const authScreen = document.getElementById('auth-screen');
        const appContent = document.getElementById('app-content');
        const authForm = document.getElementById('auth-form');
        const authEmail = document.getElementById('auth-email');
        const authPassword = document.getElementById('auth-password');
        const authTitle = document.getElementById('auth-title');
        const authToggle = document.getElementById('auth-toggle');
        const authError = document.getElementById('auth-error');
        const userInfo = document.getElementById('user-info');

        let isSignUp = false;

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.classList.add('hidden');
            const email = authEmail.value;
            const password = authPassword.value;

            try {
                if (isSignUp) {
                    await auth.createUserWithEmailAndPassword(email, password);
                    // Criar documento do usuário
                    await db.collection('usuarios').doc(auth.currentUser.uid).set({
                        email: email,
                        pontos: 0,
                        acertos: 0,
                        dataCriacao: firebase.firestore.Timestamp.now()
                    });
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (err) {
                authError.textContent = err.message;
                authError.classList.remove('hidden');
            }
        });

        authToggle.addEventListener('click', () => {
            isSignUp = !isSignUp;
            authTitle.textContent = isSignUp ? 'Registrar' : 'Login';
            authToggle.innerHTML = isSignUp 
                ? 'Já tem conta? <span class="text-blue-600 font-semibold">Faça login</span>'
                : 'Não tem conta? <span class="text-blue-600 font-semibold">Registre-se</span>';
        });

        loginBtn.addEventListener('click', () => {
            authScreen.style.display = 'block';
            appContent.classList.add('hidden');
        });

        logoutBtn.addEventListener('click', async () => {
            await auth.signOut();
        });

        auth.onAuthStateChanged(async (user) => {
            state.currentUser = user;
            if (user) {
                authScreen.style.display = 'none';
                appContent.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');
                userInfo.textContent = `👤 ${user.email}`;
                await carregarJogos();
                await carregarRanking();
                await verificarSeEhAdmin();
            } else {
                authScreen.style.display = 'block';
                appContent.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
                userInfo.textContent = '';
                limparListeners();
            }
        });

        // ========== VERIFICAR PERMISSÃO ADMIN ==========
        async function verificarSeEhAdmin() {
            try {
                const doc = await db.collection('admins').doc(state.currentUser.uid).get();
                const adminTab = document.querySelector('[data-tab="admin"]');
                if (doc.exists) {
                    adminTab.classList.remove('hidden');
                } else {
                    adminTab.classList.add('hidden');
                }
            } catch (err) {
                console.log("Erro ao verificar admin:", err);
            }
        }

        // ========== NAVEGAÇÃO ENTRE ABAS ==========
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tabName = e.target.dataset.tab;
                state.currentTab = tabName;
                
                document.querySelectorAll('.tab-content').forEach(tab => {
                    tab.classList.remove('active');
                });
                document.getElementById(tabName).classList.add('active');
                
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('border-b-2', 'border-blue-600', 'text-blue-600', 'font-semibold');
                    b.classList.add('text-gray-600', 'hover:text-gray-800');
                });
                e.target.classList.add('border-b-2', 'border-blue-600', 'text-blue-600', 'font-semibold');
                e.target.classList.remove('text-gray-600', 'hover:text-gray-800');

                limparListeners();
                
                if (tabName === 'jogos') {
                    state.jogosPage = 0;
                    carregarJogos();
                } else if (tabName === 'ranking') {
                    state.rankingPage = 0;
                    carregarRanking();
                } else if (tabName === 'admin') {
                    carregarAdminPainel();
                }
            });
        });

        // ========== FILTRO DE FASE ==========
        document.getElementById('fase-filter').addEventListener('change', (e) => {
            state.faseFilter = e.target.value;
            state.jogosPage = 0;
            carregarJogos();
        });

        // ========== CARREGAR JOGOS ==========
        async function carregarJogos() {
            const container = document.getElementById('jogos-container');
            const btnCarregarMais = document.getElementById('carregar-mais-jogos');

            limparListeners();
            container.innerHTML = '<p class="text-center text-gray-500">Carregando...</p>';

            try {
                let query = db.collection('jogos').orderBy('dataHora', 'asc');
                
                if (state.faseFilter) {
                    query = query.where('fase', '==', state.faseFilter);
                }

                query = query.limit(ITEMS_POR_PAGINA + 1);

                const unsubscribe = query.onSnapshot(async (snapshot) => {
                    container.innerHTML = '';
                    const jogos = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    })).slice(0, ITEMS_POR_PAGINA);

                    if (jogos.length === 0) {
                        container.innerHTML = '<p class="text-center text-gray-500">Nenhum jogo encontrado</p>';
                        btnCarregarMais.classList.add('hidden');
                        return;
                    }

                    for (const jogo of jogos) {
                        const palpiteDoc = await db.collection('palpites')
                            .doc(`${state.currentUser.uid}_${jogo.id}`).get();
                        
                        jogo.palpiteSalvo = palpiteDoc.exists;
                        if (palpiteDoc.exists) {
                            const palpite = palpiteDoc.data();
                            jogo.golsMandante = palpite.golsMandante;
                            jogo.golsVisitante = palpite.golsVisitante;
                            jogo.vencedorPenaltis = palpite.vencedorPenaltis;
                        }

                        const card = criarCardJogo(jogo);
                        container.appendChild(card);
                    }

                    btnCarregarMais.classList.toggle('hidden', snapshot.docs.length <= ITEMS_POR_PAGINA);
                });

                state.listeners.push(unsubscribe);
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-500">Erro: ${err.message}</p>`;
            }
        }

        function criarCardJogo(jogo) {
            const div = document.createElement('div');
            div.className = 'card-jogo';
            
            const trava = estaTravaAtivaParaJogo(jogo);
            const estadoClass = jogo.palpiteSalvo ? 'estado-salvo' : 'estado-nao-salvo';
            const estadoText = jogo.palpiteSalvo ? '✓ Palpite Salvo' : '⚠ Não Salvo';

            div.innerHTML = `
                <div class="flex justify-between items-start mb-3">
                    <div>
                        <p class="text-sm text-gray-500">${jogo.fase} • ${formatarData(jogo.dataHora)}</p>
                        <p class="text-lg font-bold">${jogo.mandante || 'TBD'} vs ${jogo.visitante || 'TBD'}</p>
                    </div>
                    <span class="${estadoClass}">${estadoText}</span>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Gols ${jogo.mandante || 'Mandante'}</label>
                        <input type="number" data-jogo-id="${jogo.id}" data-field="golsMandante" min="0" 
                            value="${jogo.golsMandante || ''}" class="palpite-input w-full border border-gray-300 rounded px-2 py-1" 
                            ${trava ? 'disabled' : ''}>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Gols ${jogo.visitante || 'Visitante'}</label>
                        <input type="number" data-jogo-id="${jogo.id}" data-field="golsVisitante" min="0" 
                            value="${jogo.golsVisitante || ''}" class="palpite-input w-full border border-gray-300 rounded px-2 py-1" 
                            ${trava ? 'disabled' : ''}>
                    </div>
                </div>

                ${jogo.fase !== 'Grupos' ? `
                    <div class="mb-4">
                        <label class="block text-xs text-gray-600 mb-2">Se ir a pênaltis:</label>
                        <select data-jogo-id="${jogo.id}" data-field="vencedorPenaltis" class="w-full border border-gray-300 rounded px-2 py-1" ${trava ? 'disabled' : ''}>
                            <option value="">Nenhum</option>
                            <option value="${jogo.mandante}" ${jogo.vencedorPenaltis === jogo.mandante ? 'selected' : ''}>
                                ${jogo.mandante} (pênaltis)
                            </option>
                            <option value="${jogo.visitante}" ${jogo.vencedorPenaltis === jogo.visitante ? 'selected' : ''}>
                                ${jogo.visitante} (pênaltis)
                            </option>
                        </select>
                    </div>
                ` : ''}

                <button data-jogo-id="${jogo.id}" class="btn-salvar-palpite btn-primario w-full" ${trava ? 'disabled opacity-50 cursor-not-allowed' : ''}>
                    ${trava ? '🔒 Jogo Trancado' : '💾 Salvar Palpite'}
                </button>
                ${trava ? '<p class="text-xs text-red-600 mt-2">Este jogo começa em menos de 2 horas</p>' : ''}
            `;

            const btn = div.querySelector('.btn-salvar-palpite');
            btn.addEventListener('click', async (e) => {
                e.preventDefault();
                await salvarPalpite(jogo.id);
            });

            div.querySelectorAll('.palpite-input, [data-field="vencedorPenaltis"]').forEach(input => {
                input.addEventListener('change', () => {
                    // Marcar como não salvo
                    const estadoSpan = div.querySelector('[class*="estado-"]');
                    estadoSpan.className = 'estado-nao-salvo';
                    estadoSpan.textContent = '⚠ Não Salvo';
                });
            });

            return div;
        }

        async function salvarPalpite(jogoId) {
            if (!state.currentUser) return;

            const card = document.querySelector(`[data-jogo-id="${jogoId}"]`).closest('.card-jogo');
            const golsMandante = parseInt(card.querySelector('[data-field="golsMandante"]').value) || 0;
            const golsVisitante = parseInt(card.querySelector('[data-field="golsVisitante"]').value) || 0;
            const vencedorPenaltisSelect = card.querySelector('[data-field="vencedorPenaltis"]');
            const vencedorPenaltis = vencedorPenaltisSelect ? vencedorPenaltisSelect.value : '';

            try {
                await db.collection('palpites').doc(`${state.currentUser.uid}_${jogoId}`).set({
                    userId: state.currentUser.uid,
                    jogoId: jogoId,
                    golsMandante,
                    golsVisitante,
                    vencedorPenaltis,
                    dataSalva: firebase.firestore.Timestamp.now()
                }, { merge: true });

                const estadoSpan = card.querySelector('[class*="estado-"]');
                estadoSpan.className = 'estado-salvo';
                estadoSpan.textContent = '✓ Palpite Salvo';
            } catch (err) {
                alert('Erro ao salvar: ' + err.message);
            }
        }

        // Botão Carregar Mais Jogos
        document.getElementById('carregar-mais-jogos').addEventListener('click', () => {
            state.jogosPage++;
            carregarJogos();
        });

        // ========== CARREGAR RANKING ==========
        async function carregarRanking() {
            const tbody = document.getElementById('ranking-tbody');
            const btnCarregarMais = document.getElementById('carregar-mais-ranking');

            limparListeners();
            tbody.innerHTML = '<tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">Carregando...</td></tr>';

            try {
                let query = db.collection('usuarios')
                    .orderBy('pontos', 'desc')
                    .limit(RANKING_POR_PAGINA + 1);

                const unsubscribe = query.onSnapshot((snapshot) => {
                    tbody.innerHTML = '';
                    const usuarios = snapshot.docs.slice(0, RANKING_POR_PAGINA).map((doc, idx) => ({
                        posicao: idx + 1,
                        ...doc.data()
                    }));

                    usuarios.forEach(usuario => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="px-4 py-3 font-bold text-lg">#${usuario.posicao}</td>
                            <td class="px-4 py-3">${usuario.email}</td>
                            <td class="px-4 py-3 text-center font-bold text-blue-600">${usuario.pontos || 0}</td>
                            <td class="px-4 py-3 text-center">${usuario.acertos || 0}</td>
                        `;
                        tbody.appendChild(tr);
                    });

                    btnCarregarMais.classList.toggle('hidden', snapshot.docs.length <= RANKING_POR_PAGINA);
                });

                state.listeners.push(unsubscribe);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-red-500">Erro: ${err.message}</td></tr>`;
            }
        }

        document.getElementById('carregar-mais-ranking').addEventListener('click', () => {
            state.rankingPage++;
            carregarRanking();
        });

        // ========== PAINEL ADMIN ==========
        async function carregarAdminPainel() {
            const container = document.getElementById('admin-jogos-container');
            limparListeners();
            container.innerHTML = '<p class="text-center text-gray-500">Carregando...</p>';

            try {
                const unsubscribe = db.collection('jogos')
                    .orderBy('dataHora', 'asc')
                    .limit(50)
                    .onSnapshot((snapshot) => {
                        container.innerHTML = '';
                        snapshot.docs.forEach(doc => {
                            const jogo = { id: doc.id, ...doc.data() };
                            const div = document.createElement('div');
                            div.className = 'border border-gray-300 p-3 rounded-lg mb-2';
                            const estado = jogo.resultadoProcessado ? 'estado-processado' : 'estado-pendente';
                            const estadoText = jogo.resultadoProcessado ? '✓ Processado' : '⏳ Pendente';

                            div.innerHTML = `
                                <div class="flex justify-between items-center mb-2">
                                    <div>
                                        <p class="font-semibold">${jogo.mandante} vs ${jogo.visitante}</p>
                                        <p class="text-xs text-gray-500">${formatarData(jogo.dataHora)}</p>
                                    </div>
                                    <span class="${estado}">${estadoText}</span>
                                </div>
                                <div class="grid grid-cols-2 gap-2 mb-2">
                                    <input type="number" placeholder="Gols ${jogo.mandante}" value="${jogo.golsReaisMandante || ''}" 
                                        data-jogo-id="${jogo.id}" data-field="reais-mandante" class="border border-gray-300 rounded px-2 py-1 text-sm">
                                    <input type="number" placeholder="Gols ${jogo.visitante}" value="${jogo.golsReaisVisitante || ''}" 
                                        data-jogo-id="${jogo.id}" data-field="reais-visitante" class="border border-gray-300 rounded px-2 py-1 text-sm">
                                </div>
                                <button data-jogo-id="${jogo.id}" class="btn-processar-resultado btn-primario w-full text-sm py-1">
                                    Processar Resultado
                                </button>
                            `;

                            const btn = div.querySelector('.btn-processar-resultado');
                            btn.addEventListener('click', async () => {
                                await processarResultado(jogo.id);
                            });

                            container.appendChild(div);
                        });
                    });

                state.listeners.push(unsubscribe);
            } catch (err) {
                container.innerHTML = `<p class="text-center text-red-500">Erro: ${err.message}</p>`;
            }
        }

        async function processarResultado(jogoId) {
            const jogo = await db.collection('jogos').doc(jogoId).get();
            if (!jogo.exists) return;

            const jogoData = jogo.data();
            const adminDiv = document.querySelector(`[data-jogo-id="${jogoId}"]`).closest('div');
            const golsMandante = parseInt(adminDiv.querySelector('[data-field="reais-mandante"]').value) || 0;
            const golsVisitante = parseInt(adminDiv.querySelector('[data-field="reais-visitante"]').value) || 0;

            try {
                // Se já foi processado, estornar pontos antigos
                if (jogoData.resultadoProcessado) {
                    await db.collection('palpites')
                        .where('jogoId', '==', jogoId)
                        .get()
                        .then(snapshot => {
                            snapshot.forEach(doc => {
                                db.collection('palpites').doc(doc.id).update({
                                    pontos: 0,
                                    acertos: 0
                                });
                            });
                        });
                }

                // Calcular novos pontos para cada palpite
                const palpites = await db.collection('palpites').where('jogoId', '==', jogoId).get();
                palpites.forEach(async (palpiteDoc) => {
                    const palpite = palpiteDoc.data();
                    let pontos = 0;
                    let acertos = 0;

                    if (palpite.golsMandante === golsMandante && palpite.golsVisitante === golsVisitante) {
                        pontos = 10;
                        acertos = 1;
                    } else if ((palpite.golsMandante > palpite.golsVisitante && golsMandante > golsVisitante) ||
                               (palpite.golsMandante < palpite.golsVisitante && golsMandante < golsVisitante) ||
                               (palpite.golsMandante === palpite.golsVisitante && golsMandante === golsVisitante)) {
                        pontos = 5;
                    }

                    await db.collection('palpites').doc(palpiteDoc.id).update({
                        pontos,
                        acertos
                    });

                    // Atualizar usuário
                    const user = await db.collection('usuarios').doc(palpite.userId).get();
                    const userData = user.data() || {};
                    await db.collection('usuarios').doc(palpite.userId).set({
                        pontos: (userData.pontos || 0) + pontos,
                        acertos: (userData.acertos || 0) + acertos,
                        email: userData.email || palpite.userId
                    }, { merge: true });
                });

                // Marcar jogo como processado
                await db.collection('jogos').doc(jogoId).update({
                    golsReaisMandante: golsMandante,
                    golsReaisVisitante: golsVisitante,
                    resultadoProcessado: true
                });

                alert('Resultado processado com sucesso!');
            } catch (err) {
                alert('Erro: ' + err.message);
            }
        }

        // ========== ENVIAR E-MAILS ==========
        document.getElementById('send-emails-btn').addEventListener('click', async () => {
            const message = document.getElementById('email-message').value;
            const status = document.getElementById('email-status');
            const btn = document.getElementById('send-emails-btn');

            if (!message.trim()) {
                status.textContent = '❌ Escreva uma mensagem';
                return;
            }

            try {
                btn.disabled = true;
                btn.classList.add('loading');
                status.textContent = 'Obtendo lista de participantes...';

                const usuarios = await db.collection('usuarios').get();
                const emails = usuarios.docs.map(doc => doc.data().email);

                status.textContent = `📧 Enviando ${emails.length} e-mails...`;

                let enviados = 0;
                for (const email of emails) {
                    try {
                        await emailjs.send(
                            CONFIG.EMAILJS.serviceId,
                            CONFIG.EMAILJS.templateId,
                            {
                                to_email: email,
                                message: message
                            }
                        );
                        enviados++;
                        status.textContent = `📧 Enviados: ${enviados}/${emails.length}`;
                    } catch (err) {
                        console.log(`Erro ao enviar para ${email}:`, err);
                    }
                    // Throttling: aguardar 250ms entre envios
                    await new Promise(resolve => setTimeout(resolve, 250));
                }

                status.textContent = `✅ ${enviados} e-mails enviados com sucesso!`;
                document.getElementById('email-message').value = '';
            } catch (err) {
                status.textContent = '❌ Erro: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        });
