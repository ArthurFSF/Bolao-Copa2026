<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolão Copa do Mundo 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/timezone.js"></script>
    <style>
        :root {
            --verde: #009c3b;
            --amarelo: #ffdf00;
            --azul: #002776;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .estado-salvo { background-color: #d1fae5; color: #065f46; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .estado-nao-salvo { background-color: #fef3c7; color: #92400e; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .estado-pendente { background-color: #fee2e2; color: #991b1b; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .estado-processado { background-color: #d1fae5; color: #065f46; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
        .card-jogo { background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 0.5rem; padding: 1rem; margin-bottom: 0.75rem; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); transition: box-shadow 0.2s; }
        .card-jogo:hover { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btn-primario { background-color: #002776; color: #ffffff; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; transition: background-color 0.2s; }
        .btn-primario:hover { background-color: #001a50; }
        .btn-sucesso { background-color: #009c3b; color: #ffffff; padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 600; transition: background-color 0.2s; }
        .btn-sucesso:hover { background-color: #007a2e; }
        .loading { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-50">

    <script>
        const CONFIG = {
            FIREBASE: {
                apiKey: "AIzaSyAXItDoa0tFDrLyJFHv5XYFaF6wdZk-KbM",
                authDomain: "bolaocopa2026-9f2c5.firebaseapp.com",
                projectId: "bolaocopa2026-9f2c5",
                storageBucket: "bolaocopa2026-9f2c5.firebasestorage.app",
                messagingSenderId: "1013975984344",
                appId: "1:1013975984344:web:cf16bdfd401c3c2c390fad"
            },
            EMAILJS: {
                serviceId: "service_XXXXXXXX", 
                templateId: "template_XXXXXXXX", 
                userId: "YOUR_EMAILJS_PUBLIC_KEY" 
            },
            TIMEZONE: "America/Sao_Paulo"
        };

        // Inicialização dos Plugins de Fusos Horários
        dayjs.extend(window.dayjs_plugin_utc);
        dayjs.extend(window.dayjs_plugin_timezone);
        dayjs.tz.setDefault(CONFIG.TIMEZONE);
    </script>

    <div id="app" class="min-h-screen bg-gray-50">
        <nav class="sticky top-0 z-50 bg-white shadow border-b border-yellow-400">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                <h1 class="text-2xl font-bold text-blue-800">⚽ Bolão Brasil 2026</h1>
                <div id="user-info" class="text-sm font-medium text-gray-700"></div>
                <button id="logout-btn" class="btn-primario hidden">Sair</button>
                <button id="login-btn" class="btn-primario">Entrar</button>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto px-4 py-6">
            <div id="auth-screen" class="auth-screen">
                <div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-lg shadow-lg border-t-4 border-green-600">
                    <h2 id="auth-title" class="text-2xl font-bold mb-6 text-center text-gray-800">Acessar Bolão</h2>
                    <form id="auth-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-700">E-mail</label>
                            <input id="auth-email" type="email" required placeholder="seu@email.com" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1 text-gray-700">Senha</label>
                            <input id="auth-password" type="password" required placeholder="••••••••" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-500">
                        </div>
                        <button type="submit" class="btn-sucesso w-full py-2.5">Entrar</button>
                    </form>
                    <p id="auth-toggle" class="text-center text-sm text-gray-600 mt-4 cursor-pointer">
                        Não tem uma conta? <span class="text-blue-700 font-semibold">Registre-se</span>
                    </p>
                    <div id="auth-error" class="mt-4 p-3 bg-red-100 text-red-800 rounded-lg hidden text-sm"></div>
                </div>
            </div>

            <div id="app-content" class="hidden">
                <div class="flex gap-2 mb-6 border-b border-gray-300 overflow-x-auto">
                    <button data-tab="jogos" class="tab-btn px-4 py-2 border-b-2 border-blue-700 text-blue-700 font-semibold whitespace-nowrap">🎯 Partidas</button>
                    <button data-tab="longo-prazo" class="tab-btn px-4 py-2 text-gray-600 hover:text-gray-800 whitespace-nowrap">🏅 Palpites Especiais</button>
                    <button data-tab="ranking" class="tab-btn px-4 py-2 text-gray-600 hover:text-gray-800 whitespace-nowrap">🏆 Classificação Geral</button>
                    <button data-tab="admin" class="tab-btn px-4 py-2 text-gray-600 hover:text-gray-800 hidden whitespace-nowrap">⚙️ Painel Admin</button>
                </div>

                <div id="jogos" class="tab-content active">
                    <div class="mb-4 flex gap-2 flex-wrap items-center justify-between">
                        <select id="fase-filter" class="border border-gray-300 rounded-lg px-3 py-2 bg-white text-sm focus:ring-2 focus:ring-blue-500">
                            <option value="">Todas as Fases</option>
                            <option value="Grupos">Fase de Grupos</option>
                            <option value="32avos">Fase de 32-avos</option>
                            <option value="16avos">Fase
